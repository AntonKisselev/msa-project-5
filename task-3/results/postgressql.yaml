apiVersion: v1
kind: Pod
metadata:
  name: postgresql-pod
  namespace: default
  labels:
    app: postgresql
spec:
  containers:
    - name: postgresql
      image: postgres:latest
      env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: db-exporter-config
              key: POSTGRES_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: db-exporter-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: db-exporter-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: db-exporter-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: db-exporter-config
              key: DB_PASSWORD
        - name: POSTGRES_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: db-exporter-config
              key: POSTGRES_PASSWORD
      ports:
        - containerPort: 5432
          protocol: TCP